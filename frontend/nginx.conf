server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload hợp đồng tối đa 10 MB, cho thêm chút biên cho multipart overhead.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Asset có hash trong tên nên cache vĩnh viễn được.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8023;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE của /chat/stream: tắt buffering để token tới trình duyệt ngay,
        # và nới timeout vì một câu trả lời có thể mất hơn một phút.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health {
        proxy_pass http://backend:8023/health;
        proxy_set_header Host $host;
    }

    # SPA fallback: mọi route do React Router xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
